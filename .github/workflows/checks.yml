name: Template checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  template-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check template structure and local links
        # 完成初始化后加上 --initialized；另行加入真实产品检查和测试。
        run: python3 scripts/check_project.py
      - name: Test the checker (not product acceptance)
        run: python3 -m unittest discover -s scripts/tests -v
